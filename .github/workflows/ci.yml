name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Builds and measures one scenario for one PlayCanvas and one three.js release, then
      # generates the report from the committed results. The browser check is skipped, as hosted
      # runners have no GPU.
      - run: npm test
