name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Builds and measures one scenario for one PlayCanvas and one three.js release, then
      # generates the report from the committed results. The browser check is skipped, as hosted
      # runners have no GPU.
      - run: npm test

  # Builds the whole report site, with the runnable build of every published release. A pull
  # request keeps it as an artifact to look at; a push to main hands it to the deploy job.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the installed releases only change when a result is added
      - uses: actions/cache@v6
        with:
          path: .cache/engine
          key: engines-${{ hashFiles('results/*.json') }}
          restore-keys: engines-
      - run: npm run builds
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: report-site
          path: |
            dist/index.html
            dist/report
            dist/builds
          if-no-files-found: error
          retention-days: 30
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes the site to GitHub Pages: https://mvaligursky.github.io/playcanvas-metrics/
  deploy:
    if: github.event_name == 'push'
    needs: [check, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # a newer push waits for a deployment in progress, and replaces any that is still queued
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
